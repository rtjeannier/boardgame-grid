# Every tunable in the pipeline, at its default value.
#
# Generated by `python -c "from pipeline.params import Params; print(Params().to_toml())"`,
# so it cannot drift from what the code reads. Pass it with:
#
#     python -m pipeline.build --config grid.example.toml --report
#
# Anything you omit keeps its default, so a sweep file need only name what it
# changes. An unknown key is an error rather than a silent no-op — a typo in a
# sweep config should fail loudly.
#
# The three tiers say who a value belongs to:
#
#   [presentation]
alternates_per_cell = 6
suggestions_per_gap = 3
gap_threshold = 0.5
genres_shown_per_game = 3
min_loading_shown = 0.05
genre_top_signals = 3
row_names = ["Gateway", "Light", "Medium", "Medium-Heavy", "Heavy", "Brain-burner"]
genre_name_separator = " · "
genre_compound = " + "

[collection]
weight_rows = 5
picks_per_cell = 5
collection_size = 15
picks_per_column = {}
picks_per_row = {}
player_columns = [["1", 1, 1], ["2", 2, 2], ["3", 3, 3], ["4", 4, 4], ["5", 5, 5], ["6-8", 6, 8], ["8+", 9, 0]]
genre_weights = {}

[hyper.selection]
quality_floor = 0.2
quality_exponent = 2.0
genre_floor = 0.5
column_floor = 0.25
cell_floor = 0.05
similarity_exponent = 3
collection_weight = 0.1
replacement_keep = 0.75
genre_repeat_penalty = 0.35
gain_floor = 0.0
recommended_weight = 0.5
weight_taper = 0.15

[hyper.discovery]
genre_spokes = 12
genre_min_reach = 15
genre_reach_divisor = 10
genre_base_rate = 0.125
genre_min_cohesion = 0.1
genre_growth = 0.4
genre_min_lift = 1.3
genre_interaction = 1.7
genre_spans = 0.6
spanning_coverage = 0.9
genre_scarcity = 0.5
continuous_scale = 0.25

[hyper.baseline]
mmr_lambda = 0.5
